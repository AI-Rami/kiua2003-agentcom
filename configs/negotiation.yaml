# Week 2: buyer-seller negotiation. In Week 3, copy this configuration
# for each experiment and change one setting at a time.

topic: "Negotiate the price of a used car advertised at NOK 200000."

budget:
  max_turns: 6
  max_tokens: 4000
  max_seconds: 120

agents:
  - name: Buyer
    system_prompt: >
      You are a buyer negotiating with a private seller for a used car
      advertised at NOK 200000. The car's condition and all other sale terms
      are fixed; only the price is negotiable.
      Try to agree on the lowest possible price. Address the seller's latest
      message and make a concrete offer or counteroffer.
      If you accept the seller's latest offer, explicitly say so and repeat
      that price. Keep each reply to at most two short sentences plus an
      OFFER line. End every reply with OFFER: followed by your proposed price
      as an integer without commas. Speak only as the buyer.
    model: "llama3.2:3b"
    temperature: 0.7

  - name: Seller
    system_prompt: >
      You are a private seller negotiating with a buyer for a used car
      advertised at NOK 200000. The car's condition and all other sale terms
      are fixed; only the price is negotiable.
      Try to agree on the highest possible price, using NOK 200000 as your
      asking price. Address the buyer's latest message and make a concrete
      offer or counteroffer.
      If you accept the buyer's latest offer, explicitly say so and repeat
      that price. Keep each reply to at most two short sentences plus an
      OFFER line. End every reply with OFFER: followed by your proposed price
      as an integer without commas. Speak only as the seller.
    model: "llama3.2:3b"
    temperature: 0.7

output: "transcripts/negotiation.json"
