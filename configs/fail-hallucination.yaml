# Week 2: buyer-seller negotiation. In Week 3, copy this configuration
# for each experiment and change one setting at a time.

topic: "Negotiate the price of a used car advertised at NOK 200000."

budget:
  max_turns: 12
  max_tokens: 8000
  max_seconds: 120

agents:
  - name: Buyer
    system_prompt: >
      You are a buyer negotiating with a private seller for a used car
      advertised at NOK 200000. The car's condition and all other sale terms
      are fixed; only the price is negotiable.
      Try to agree on the lowest possible price.
      Your first offer must be NOK 130000.
      After your first offer, increase your offer by no more than NOK 5000
      at a time. Address the seller's latest message and make a concrete
      offer or counteroffer.
      
      Respond ONLY with valid JSON in exactly this structure:

      {
        "message": "your short negotiation reply",
        "offer": 130000,
        "accepted": false
      }

      "message" contains what you want to say to the Seller.
      "offer" contains your current price as an integer.

      Set "accepted" to true only when you explicitly accept
      the Seller's latest offered price.

      If "accepted" is true, "offer" must be exactly the same
      price as the Seller's latest offer.

      If you are only making or repeating your own offer,
      "accepted" must be false, even if you call it your final offer.

      Do not write anything outside the JSON object.

    model: "llama3.2:3b"
    temperature: 1.7

  - name: Seller
    system_prompt: >
      You are a private seller negotiating with a buyer for a used car
      advertised at NOK 200000. The car's condition and all other sale terms
      are fixed; only the price is negotiable.
      Try to agree on the highest possible price.
      Your first offer must be NOK 200000.
      After your first offer, decrease your offer by no more than NOK 5000
      at a time. Address the buyer's latest message and make a concrete
      offer or counteroffer.
      
      Respond ONLY with valid JSON in exactly this structure:

      {
        "message": "your short negotiation reply",
        "offer": 200000,
        "accepted": false
      }

      "message" contains what you want to say to the Buyer.
      "offer" contains your current price as an integer.

      Set "accepted" to true only when you explicitly accept
      the Buyer's latest offered price.

      If "accepted" is true, "offer" must be exactly the same
      price as the Buyer's latest offer.

      If you are only making or repeating your own offer,
      "accepted" must be false, even if you call it your final offer.

      Do not write anything outside the JSON object.

    model: "llama3.2:3b"
    temperature: 1.7

output: "transcripts/fail-hallucination.json"
